<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>个人站 · 三种设计方向</title><style>:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#f4f2ed;color:#272723;font:16px/1.7 'Microsoft YaHei',sans-serif}main{max-width:1100px;padding:48px 24px;margin:auto}h1{font-size:clamp(30px,5vw,52px);line-height:1.2}p{max-width:65ch;color:#555}.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;margin-top:40px}a{color:inherit}article{border-top:2px solid;padding-top:20px}article>a{display:inline-block;margin-top:12px;padding:12px 0;text-underline-offset:5px}article img{display:block;width:100%;height:220px;object-fit:cover;object-position:top;border:1px solid #ccc}a:focus-visible{outline:3px solid #44694e;outline-offset:4px}small{color:#555}@media(max-width:700px){.choices{grid-template-columns:minmax(0,1fr)}article img{height:260px}}</style></head><body><main><small>门户 + 摄影 + 博客 · 设计探索</small><h1>选择你的个人站方向</h1><p>恢复初版的视觉与版式：摄影保留大幅照片，技术博客拥有独立入口与页面。个人信息与内容均为演示。</p><div class="choices"><article><h2>A · 图文杂志</h2><a href="magazine/index.html"><img src="magazine/desktop.png" alt="图文杂志桌面预览"></a><p>黑白大字、图文并列。门户入口并列，摄影与技术各自独立。</p><a href="magazine/index.html">打开初稿 A →</a></article><article><h2>B · 摄影画廊</h2><a href="gallery/index.html"><img src="gallery/desktop.png" alt="摄影画廊桌面预览"></a><p>深色画廊、大幅照片。进入摄影站后，让照片成为主角。</p><a href="gallery/index.html">打开初稿 B →</a></article><article><h2>C · 个人目录</h2><a href="directory/index.html"><img src="directory/desktop.png" alt="个人目录桌面预览"></a><p>留白和文字索引。入口直接，适合快速了解你。</p><a href="directory/index.html">打开初稿 C →</a></article></div><p>可以选择一版，也可以组合：例如 C 的门户、B 的摄影、独立的技术博客。正式实现将按模块分文件夹保存。</p></main></body></html>
